<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Best Friendyyye</title>
<meta name="theme-color" content="#FF6F52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Friendyyye">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF6F52'/%3E%3Ccircle cx='38' cy='50' r='11' fill='%23FFF6EE'/%3E%3Ccircle cx='64' cy='50' r='11' fill='%23FFC857'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF6F52'/%3E%3Ccircle cx='38' cy='50' r='11' fill='%23FFF6EE'/%3E%3Ccircle cx='64' cy='50' r='11' fill='%23FFC857'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Best Friendyyye","short_name":"Friendyyye","display":"standalone","background_color":"%23FFF6EE","theme_color":"%23FF6F52","start_url":"."}'>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
  :root{
    --bg:#FFF6EE; --card:#FFFFFF; --ink:#2B1B34; --inkSoft:#6E5C79;
    --coral:#FF6F52; --coralSoft:#FFE3DA; --yellow:#FFC857; --yellowSoft:#FFF3D6;
    --mint:#67C7A8; --mintSoft:#DFF5EC; --lavender:#9B84C7; --lavenderSoft:#EAE2F8;
    --line:#F0E4D8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#EFE6DB;font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
  input{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
  .display{font-family:'Fredoka',system-ui,sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #shell-wrap{display:flex;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 0 16px;min-height:100%;}
  #phone{
    width:100%; max-width:420px; height:min(860px, calc(100vh - 32px));
    background:var(--bg); border-radius:34px; overflow:hidden; position:relative;
    box-shadow:0 30px 60px -20px rgba(43,27,52,.35); display:flex; flex-direction:column;
  }
  @media (min-width:460px){ #phone{ border:10px solid #1B1120; } }
  #statusbar{display:flex;justify-content:space-between;padding:10px 22px 0;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);flex-shrink:0;}
  #content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
  .screen{flex:1;display:flex;flex-direction:column;padding:0 16px 16px;overflow-y:auto;position:relative;}
  .screen.center{align-items:center;justify-content:center;}
  .screen.between{justify-content:space-between;}
  .screen.flush{padding-bottom:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5;flex-shrink:0;}
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .icon-btn{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .btn-primary{width:100%;padding:14px 18px;border-radius:16px;background:var(--coral);color:#fff;border:none;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 18px -6px rgba(255,111,82,.5);}
  .btn-primary:disabled{background:#F1D9CF;box-shadow:none;cursor:not-allowed;}
  .btn-ghost{width:100%;padding:14px 18px;border-radius:16px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:700;font-size:15px;cursor:pointer;}
  .card{background:var(--card);border-radius:20px;border:1px solid var(--line);padding:16px;}
  .row{display:flex;align-items:center;gap:12px;padding:12px 4px;}
  .row-icon{width:34px;height:34px;border-radius:10px;background:var(--coralSoft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--coral);}
  .row-icon.danger{background:#FDE7E4;color:#E0503A;}
  .toggle{width:42px;height:24px;border-radius:999px;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s;}
  .toggle .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  input.field{width:100%;font-size:14px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);outline:none;background:var(--card);color:var(--ink);}
  input.field:focus{border-color:var(--coral);}
  input.field::placeholder{color:#B9ACC2;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .section-title{font-family:'Fredoka';font-size:15px;font-weight:600;color:var(--ink);margin:18px 0 10px;}
  .bottomnav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:8px 6px calc(12px + env(safe-area-inset-bottom));flex-shrink:0;}
  .navbtn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;color:var(--inkSoft);}
  .navbtn.active{color:var(--coral);}
  .navbtn span{font-size:9.5px;font-weight:600;}
  .orbit-wrap{position:relative;}
  .orbit-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,111,82,.35);}
  .orbit-pivot{position:absolute;inset:0;animation:spin 6s linear infinite;}
  .orbit-dot{position:absolute;top:0;left:50%;width:22%;height:22%;margin-left:-11%;border-radius:50%;}
  .orbit-wrap.paired .orbit-pivot{animation:none;}
  .orbit-wrap.paired .dot-a{top:50%;left:38%;margin:-11% 0 0 -11%;}
  .orbit-wrap.paired .dot-b{top:50%;left:62%;margin:-11% 0 0 -11%;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .modal-overlay{position:absolute;inset:0;background:rgba(43,27,52,.5);display:flex;align-items:center;justify-content:center;z-index:20;border-radius:24px;}
  .modal-box{background:#fff;border-radius:20px;padding:20px;width:82%;}
  .badge{background:var(--yellowSoft);border-radius:12px;padding:8px 12px;font-size:11.5px;font-weight:700;color:var(--ink);}
  .bubble{max-width:76%;padding:10px 13px;border-radius:16px;font-size:13.5px;}
  .bubble.me{margin-left:auto;background:var(--coral);color:#fff;border-bottom-right-radius:4px;}
  .bubble.friend{background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:4px;}
  svg.i{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
<div id="shell-wrap"><div id="phone">
  <div id="statusbar"><span>9:41</span><span>●●● 100%</span></div>
  <div id="content"></div>
</div></div>

<script>
/* ---------------- icons (small hand-authored set, no dependency) ---------------- */
const ICON = {

  home:'<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  chat:'<path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  game:'<rect x="2" y="7" width="20" height="10" rx="4"/><path d="M8 10v4M6 12h4"/><circle cx="16" cy="11" r="1"/><circle cx="18.5" cy="13.5" r="1"/>',
  gift:'<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18"/><path d="M8 9a2.5 2.5 0 010-5c1.5 0 4 2 4 5"/><path d="M16 9a2.5 2.5 0 000-5c-1.5 0-4 2-4 5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
  camera:'<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  pin:'<path d="M12 17v5"/><path d="M9 3h6l1 6-3 3H11l-3-3z"/>',
  flame:'<path d="M12 2s5 4.5 5 10a5 5 0 01-10 0c0-1.5 1-2.5 1-2.5S9 12 12 2z"/>',
  cake:'<path d="M3 21h18v-6a3 3 0 00-3-3H6a3 3 0 00-3 3z"/><path d="M12 12V8"/><circle cx="12" cy="5" r="1.5"/><path d="M3 17h18"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-3.8M8.6 13.4l6.8 3.8"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/>',
  fingerprint:'<path d="M12 3a6 6 0 016 6c0 3 0 7 2 10"/><path d="M6 9a6 6 0 0110-4.5"/><path d="M4 12c0 3-1 5-2 6"/><path d="M12 9a3 3 0 013 3c0 4 1 7 2 8"/><path d="M9 9a3 3 0 000 6c0 2 .5 3.5 1 5"/>',
  bell:'<path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 004 0"/>',
  chevron:'<path d="M9 6l6 6-6 6"/>',
  sparkle:'<path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/>',
  star:'<path d="M12 2l2.9 6.3 6.9.8-5.1 4.8 1.4 6.9L12 17.3 5.9 20.8l1.4-6.9L2.2 9.1l6.9-.8z"/>',
  shield:'<path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/>',
  volume:'<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M16 8a5 5 0 010 8"/>',
  palette:'<circle cx="12" cy="12" r="10"/><circle cx="8" cy="10" r="1.3"/><circle cx="12" cy="8" r="1.3"/><circle cx="16" cy="10" r="1.3"/><path d="M12 22a2 2 0 002-2c0-1.5-1-1.5-1-3a3 3 0 013-3h.5a4.5 4.5 0 000-9"/>',
  logout:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>'
};
function icon(name, size=16, color='currentColor'){
  return `<svg class="i" viewBox="0 0 24 24" style="width:${size}px;height:${size}px;color:${color}">${ICON[name]||''}</svg>`;
}
function orbit(size=72, spinning=true){
  const cls = spinning ? '' : 'paired';
  return `<div class="orbit-wrap ${cls}" style="width:${size}px;height:${size}px">
    ${spinning?'<div class="orbit-ring"></div>':''}
    ${spinning ? `
      <div class="orbit-pivot"><div class="orbit-dot" style="background:var(--coral)"></div></div>
      <div class="orbit-pivot" style="animation-delay:-3s"><div class="orbit-dot" style="background:var(--yellow)"></div></div>
    ` : `
      <div class="orbit-dot dot-a" style="background:var(--coral)"></div>
      <div class="orbit-dot dot-b" style="background:var(--yellow)"></div>
    `}
  </div>`;
}

/* ---------------- data ---------------- */
const FRIEND = { name:"Aanya Kapoor", nickname:"Peanut", emoji:"🐼", mood:"Feeling unstoppable 🎉", online:true, song:{title:"Golden Hour", artist:"JVKE"} };
const MEMORIES = [
  {id:1,color:'var(--coralSoft)',emoji:'🌅',caption:'That sunset from the rooftop',date:'Aug 24'},
  {id:2,color:'var(--mintSoft)',emoji:'🍜',caption:'3am ramen run',date:'Aug 18'},
  {id:3,color:'var(--lavenderSoft)',emoji:'🎡',caption:'Fair day, best day',date:'Aug 9'},
  {id:4,color:'var(--yellowSoft)',emoji:'📸',caption:'Photobooth chaos',date:'Jul 30'},
  {id:5,color:'var(--coralSoft)',emoji:'🏖️',caption:'First beach trip together',date:'Jul 14'},
  {id:6,color:'var(--mintSoft)',emoji:'🎂',caption:'Your surprise cake',date:'Jun 2'},
];
const GAMES = [
  {id:'wyr',name:'Would You Rather',ic:'sparkle',color:'var(--coral)',soft:'var(--coralSoft)',desc:'Pick a side. Explain nothing.'},
  {id:'quiz',name:'Best-Friend Quiz',ic:'star',color:'var(--lavender)',soft:'var(--lavenderSoft)',desc:'Who knows who better.'},
  {id:'tod',name:'Truth or Dare',ic:'flame',color:'var(--mint)',soft:'var(--mintSoft)',desc:'Classic, undefeated.'},
];
const SPECIAL_DAYS = [
  {id:1,label:"Peanut's Birthday",date:'Sep 11',daysLeft:12,ic:'cake'},
  {id:2,label:'Friendship Day',date:'Jan 2',daysLeft:125,ic:'user'},
  {id:3,label:'Trip Anniversary',date:'Oct 3',daysLeft:34,ic:'calendar'},
];
const AVATARS = ["🦊","🐼","🐨","🦁","🐸","🐧","🦄","🐢"];

/* ---------------- state ---------------- */
let S = {
  flow:'splash', tab:'home', sub:null, gameOpen:null,
  me:{name:'Jordan', nickname:'Jo', emoji:'🦊'},
  avatarPick:'🦊', nameInput:'', nicknameInput:'',
  createConnected:false,
  joinValue:'', joinError:'',
  messages:[
    {id:1,from:'friend',text:'okay but did you see the sunset today',time:'9:14 PM'},
    {id:2,from:'me',text:'STOP i literally took 40 photos of it',time:'9:15 PM'},
    {id:3,from:'friend',text:'send. all forty. right now.',time:'9:15 PM'},
    {id:4,from:'me',text:'sending them to memories rn 📸',time:'9:16 PM'},
  ],
  draft:'', typing:false,
  memoryOpen:null, songPosted:false, wyrPicked:null,
  toggles:{appLock:true,biometric:false,hideContent:true,msgNotif:true,callNotif:true,birthdayNotif:true},
  confirmUnpair:false, profileView:'me',
};

function set(patch){ Object.assign(S, patch); render(); }
function go(key){
  if(['songs','days','settings'].includes(key)){ set({sub:key}); }
  else { set({tab:key, sub:null}); }
}

/* ---------------- screens ---------------- */
function screenSplash(){
  return `<div class="screen center">
    ${orbit(80)}
    <div class="display" style="font-size:26px;font-weight:700;color:var(--ink);margin-top:18px">Best Friendyyye</div>
    <div style="font-size:13px;color:var(--inkSoft);margin-top:6px">A private world for exactly two.</div>
  </div>`;
}
function screenOnboard(){
  return `<div class="screen between">
    <div style="margin-top:40px;text-align:center">
      ${orbit(72)}
      <div class="display" style="font-size:24px;font-weight:700;color:var(--ink);margin-top:16px">Best Friendyyye</div>
      <div style="font-size:13px;color:var(--inkSoft);margin-top:8px;line-height:1.5;padding:0 20px">Every space holds exactly two people. No feeds, no followers — just the two of you.</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn-primary" onclick="set({flow:'createwait'}); startCreateWait();">Start a Space</button>
      <button class="btn-ghost" onclick="set({flow:'joinentry'})">Join with a Code</button>
    </div>
  </div>`;
}
function startCreateWait(){ setTimeout(()=>set({createConnected:true}), 3200); }
function screenCreateWait(){
  const waiting = !S.createConnected;
  return `<div class="screen">
    <div class="topbar"><span class="display" style="font-size:19px;font-weight:600;color:var(--ink)">Your Space</span></div>
    <div style="text-align:center;margin-top:24px">
      <div style="font-size:13px;color:var(--inkSoft)">Share this code with your best friend</div>
      <div class="mono" style="margin-top:16px;font-size:30px;letter-spacing:4px;color:var(--ink);background:var(--card);border:1.5px dashed var(--coral);border-radius:18px;padding:18px 0">SUN-47Q</div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn-ghost" style="display:flex;align-items:center;justify-content:center;gap:6px">${icon('copy',15)} Copy</button>
        <button class="btn-ghost" style="display:flex;align-items:center;justify-content:center;gap:6px">${icon('share',15)} Share</button>
      </div>
    </div>
    <div style="margin-top:44px;text-align:center">
      ${orbit(70, waiting)}
      <div style="font-size:13px;color:var(--inkSoft);margin-top:14px">${waiting?'Waiting for your friend to join…':'Peanut just joined!'}</div>
    </div>
    <div style="margin-top:auto">
      <button class="btn-primary" ${waiting?'disabled':''} onclick="set({flow:'pairing'}); startPairing();">${waiting?'Waiting…':'Continue'}</button>
    </div>
  </div>`;
}
function screenJoinEntry(){
  return `<div class="screen">
    <div class="topbar"><span class="display" style="font-size:19px;font-weight:600;color:var(--ink)">Join a Space</span></div>
    <div style="margin-top:20px">
      <div style="font-size:13px;color:var(--inkSoft);margin-bottom:10px">Enter the invite code you were sent.</div>
      <input class="field mono" style="text-align:center;letter-spacing:3px;font-size:18px;border-color:${S.joinError?'#E0503A':'var(--line)'}" placeholder="e.g. SUN-47Q" value="${S.joinValue}" oninput="S.joinValue=this.value" />
      ${S.joinError?`<div style="font-size:12.5px;color:#E0503A;margin-top:8px">${S.joinError}</div>`:''}
      <div style="font-size:11.5px;color:var(--inkSoft);margin-top:10px">Tip: try "FULL" to see what a taken space looks like.</div>
    </div>
    <div style="margin-top:auto">
      <button class="btn-primary" onclick="submitJoin()">Join Space</button>
    </div>
  </div>`;
}
function submitJoin(){
  const v = (S.joinValue||'').trim().toUpperCase();
  if(!v){ set({joinError:'Enter the code your friend shared.'}); return; }
  if(v==='FULL'){ set({joinError:'This space already has two friends in it.'}); return; }
  set({flow:'pairing'}); startPairing();
}
function startPairing(){ setTimeout(()=>set({flow:'profilesetup'}), 2400); }
function screenPairing(){
  return `<div class="screen center">
    ${orbit(90,false)}
    <div class="display" style="font-size:22px;font-weight:700;color:var(--ink);margin-top:20px">You &amp; Peanut are connected</div>
    <div style="font-size:13px;color:var(--inkSoft);margin-top:6px">Setting up your private space…</div>
  </div>`;
}
function screenProfileSetup(){
  const ready = S.nameInput && S.nicknameInput;
  return `<div class="screen">
    <div class="topbar"><span class="display" style="font-size:19px;font-weight:600;color:var(--ink)">Set up your profile</span></div>
    <div style="text-align:center;margin-top:8px">
      <div style="width:76px;height:76px;border-radius:50%;background:var(--coralSoft);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:34px">${S.avatarPick}</div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap">
        ${AVATARS.map(a=>`<button onclick="set({avatarPick:'${a}'})" style="width:36px;height:36px;border-radius:10px;font-size:17px;cursor:pointer;background:${a===S.avatarPick?'var(--coral)':'var(--card)'};border:1px solid ${a===S.avatarPick?'var(--coral)':'var(--line)'}">${a}</button>`).join('')}
      </div>
    </div>
    <div style="margin-top:22px;display:flex;flex-direction:column;gap:12px">
      <div><div style="font-size:12px;color:var(--inkSoft);margin-bottom:6px">Your name</div><input class="field" placeholder="Jordan" value="${S.nameInput}" oninput="S.nameInput=this.value" /></div>
      <div><div style="font-size:12px;color:var(--inkSoft);margin-bottom:6px">Nickname Peanut will see</div><input class="field" placeholder="Jo" value="${S.nicknameInput}" oninput="S.nicknameInput=this.value" /></div>
    </div>

function screenChat(){
  const msgs = S.messages.map(m=>`<div style="display:flex;justify-content:${m.from==='me'?'flex-end':'flex-start'}">

function sendMsg(){
  const text = (S.draft||'').trim();
  if(!text) return;
  S.messages.push({id:Date.now(), from:'me', text, time:'now'});
  S.draft=''; S.typing=true; render();
  scrollChat();
  setTimeout(()=>{
    S.typing=false;
    S.messages.push({id:Date.now()+1, from:'friend', text:'haha exactly 😭', time:'now'});
    render(); scrollChat();
  }, 1400);
}
function scrollChat(){ const el=document.getElementById('chatlog'); if(el) el.scrollTop = el.scrollHeight; }

function toggleRow(icName, label, sub, key){

  return `<div class="row">

    <div class="toggle" style="background:${checked?'var(--coral)':'#E7DFD6'}" onclick="toggleSetting('${key}')"><div class="knob" style="left:${checked?'21px':'3px'}"></div></div>
  </div>`;
}
function plainRow(icName,label,sub,rightHtml,danger,onclick){
  return `<div class="row" ${onclick?`style="cursor:pointer" onclick="${onclick}"`:''}>
    <div class="row-icon ${danger?'danger':''}">${icon(icName,16)}</div>
    <div style="flex:1"><div style="font-weight:600;font-size:14px;color:${danger?'#E0503A':'var(--ink)'}">${label}</div>${sub?`<div style="font-size:12px;color:var(--inkSoft);margin-top:1px">${sub}</div>`:''}</div>
    ${rightHtml||icon('chevron',16,'var(--inkSoft)')}
  </div>`;
}
function toggleSetting(key){ S.toggles[key]=!S.toggles[key]; render(); }

function section(title, rowsHtml){

function doUnpair(){ S={...S, flow:'onboard', sub:null, tab:'home', confirmUnpair:false, createConnected:false}; render(); }

/* ---------------- root render ---------------- */
function currentScreenHtml(){
  if(S.flow==='splash') return screenSplash();
  if(S.flow==='onboard') return screenOnboard();
  if(S.flow==='createwait') return screenCreateWait();
  if(S.flow==='joinentry') return screenJoinEntry();
  if(S.flow==='pairing') return screenPairing();
  if(S.flow==='profilesetup') return screenProfileSetup();
  if(S.sub==='songs') return screenSongs();
  if(S.sub==='days') return screenDays();
  if(S.sub==='settings') return screenSettings();
  if(S.tab==='home') return screenHome();
  if(S.tab==='chat') return screenChat();
  if(S.tab==='memories') return screenMemories();
  if(S.tab==='games') return screenGames();
  if(S.tab==='profile') return screenProfile();
  return screenHome();
}
function bottomNavHtml(){
  const items = [['home','Home','home'],['chat','Chat','chat'],['memories','Memories','image'],['games','Games','game'],['profile','Profile','user']];
  return `<div class="bottomnav">${items.map(([key,label,ic])=>{
    const active = S.tab===key;
    return `<button class="navbtn ${active?'active':''}" onclick="go('${key}')">${icon(ic,19)}<span>${label}</span></button>`;
  }).join('')}</div>`;
}
function render(){
  const showNav = S.flow==='app' && !S.sub && !S.gameOpen;
  document.getElementById('content').innerHTML = currentScreenHtml() + (showNav?bottomNavHtml():'');
  if(S.tab==='chat' && S.flow==='app') scrollChat();
}

render();
setTimeout(()=>{ if(S.flow==='splash') set({flow:'onboard'}); }, 1700);
</script>
